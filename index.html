<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agostinho Transportes</title>
  <meta name="description" content="">
  <meta name="theme-color" content="#06173a">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="pular" href="#servicos">Ir para o conteúdo</a>

  <header class="site-header">
    <div class="container barra">
      <a class="brand" href="#inicio" aria-label="Agostinho Transportes, início"><span data-text="empresa.nome"></span></a>
      <button class="menu-btn" aria-expanded="false" aria-controls="menu">Menu</button>
      <nav id="menu" aria-label="Principal">
        <a class="nav-link" href="#servicos">Serviços</a>
        <a class="nav-link" href="#sobre">Sobre nós</a>
        <a class="nav-link" href="#atendimento">Regiões</a>
        <a class="nav-link" href="#diferenciais">Valores</a>
        <a class="nav-link" href="#contato">Contato</a>
        <a class="btn btn-sm" data-wa href="#contato">WhatsApp</a>
      </nav>
    </div>
  </header>

  <main>
    <section id="inicio" class="hero">
      <div class="container hero-grade">
        <div class="hero-texto">
          <h1 data-text="hero.titulo"></h1>
          <p class="hero-slogan" data-text="hero.slogan"></p>
          <a class="btn" data-wa href="#contato"><svg aria-hidden="true" viewBox="0 0 24 24"><use href="#i-wa"/></svg><span data-text="hero.botao"></span></a>
        </div>
      </div>
      <div class="estrada" aria-hidden="true"></div>
    </section>

    <section id="servicos" class="secao">
      <div class="container">
        <h2 data-text="servicos.titulo"></h2>
        <p class="intro" data-text="servicos.intro"></p>
        <ul id="lista-servicos" class="servicos"></ul>
      </div>
    </section>

    <section id="sobre" class="secao escura">
      <div class="container sobre-grade">
        <div class="sobre-foto reveal"><img data-img="imagens.sobre" alt="" width="700" height="800" loading="lazy"></div>
        <div class="reveal">
          <h2 data-text="sobre.titulo"></h2>
          <div id="texto-sobre" class="texto-sobre"></div>
        </div>
      </div>
    </section>

    <section id="atendimento" class="secao">
      <div class="container">
        <h2 data-text="atendimento.titulo"></h2>
        <p class="intro" data-text="atendimento.intro"></p>
        <div id="lista-regioes" class="regioes"></div>
        <p id="aviso-cobertura" class="aviso" data-text="atendimento.aviso"></p>
      </div>
    </section>

    <section id="diferenciais" class="secao suave">
      <div class="container">
        <h2 data-text="diferenciais.titulo"></h2>
        <ul id="lista-diferenciais" class="diferenciais"></ul>
      </div>
    </section>

    <section id="contato" class="secao contato">
      <div class="container reveal">
        <h2 data-text="contato.titulo"></h2>
        <p class="intro" data-text="contato.texto"></p>
        <div class="acoes">
          <a class="btn btn-claro" data-wa href="#contato"><svg aria-hidden="true" viewBox="0 0 24 24"><use href="#i-wa"/></svg><span data-text="contato.botao"></span></a>
          <a id="link-telefone" class="btn-link" href="#contato"></a>
        </div>
      </div>
    </section>
  </main>

  <footer class="rodape">
    <div class="container">© <span id="ano"></span> <span data-text="empresa.nome"></span>. <span data-text="rodape"></span></div>
  </footer>

  <a class="wa-flutuante" data-wa href="#contato" aria-label="Falar pelo WhatsApp">
    <svg aria-hidden="true" viewBox="0 0 24 24"><use href="#i-wa"/></svg>
  </a>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-wa" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.2 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.3 0 .5l-.3.4-.4.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.1 1 2.1 1.3 2.4 1.5.3.1.4.1.6-.1l.8-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.8-.1 1.4z"/></symbol>
  </svg>

  <noscript><p style="padding:1rem">Ative o JavaScript para ver o conteúdo do site.</p></noscript>
  <script src="js/config.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
